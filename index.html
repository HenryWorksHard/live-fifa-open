<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Packs — World Cup 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" data-screen="picker">

    <!-- Top bar -->
    <header class="topbar">
      <div class="topbar-flags" aria-hidden="true">
        <img src="https://flagcdn.com/h40/ar.png" alt="">
        <img src="https://flagcdn.com/h40/fr.png" alt="">
        <img src="https://flagcdn.com/h40/br.png" alt="">
        <img src="https://flagcdn.com/h40/de.png" alt="">
        <img src="https://flagcdn.com/h40/es.png" alt="">
        <img src="https://flagcdn.com/h40/gb-eng.png" alt="">
        <img src="https://flagcdn.com/h40/pt.png" alt="">
        <img src="https://flagcdn.com/h40/nl.png" alt="">
        <img src="https://flagcdn.com/h40/it.png" alt="">
        <img src="https://flagcdn.com/h40/be.png" alt="">
        <img src="https://flagcdn.com/h40/jp.png" alt="">
        <img src="https://flagcdn.com/h40/kr.png" alt="">
        <img src="https://flagcdn.com/h40/mx.png" alt="">
        <img src="https://flagcdn.com/h40/us.png" alt="">
        <img src="https://flagcdn.com/h40/ma.png" alt="">
        <img src="https://flagcdn.com/h40/ng.png" alt="">
      </div>
      <div class="topbar-tint" aria-hidden="true"></div>
      <div class="topbar-content">
        <div class="brand">
          <span class="brand-mark">P</span>
          <span class="brand-text">Packs</span>
        </div>
        <nav class="topbar-nav">
          <button class="ghost-btn ca-btn" id="copy-ca-btn" data-address="" title="Copy contract address">CA</button>
          <a class="ghost-btn icon-btn" id="x-link" href="#" target="_blank" rel="noopener" aria-label="X / Twitter">
            <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231Zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </a>
          <button class="ghost-btn" data-action="reset" title="Back to packs">Packs</button>
        </nav>
      </div>
    </header>

    <!-- Session stats bar (visible during pack/reveal) -->
    <aside class="stats-bar" aria-label="Session stats">
      <div class="stat-cell">
        <span>Packs Opened</span>
        <strong id="stat-packs">0</strong>
      </div>
      <div class="stat-cell">
        <span>Best Pull</span>
        <strong id="stat-best">—</strong>
      </div>
      <div class="stat-cell">
        <span>Total Cards</span>
        <strong id="stat-total">0</strong>
      </div>
      <button class="stat-btn" id="reset-stats">Reset Stats</button>
      <button class="stat-btn highlight" id="another-pack">Open another pack!</button>
    </aside>

    <!-- Screen: pack/set picker -->
    <section class="screen" data-screen-id="picker">
      <h1 class="display-h1">World Cup 2026 Drops</h1>
      <p class="subtitle">Pick a pack. Open it. See who you pulled.</p>

      <div class="pack-grid">
        <button class="pack-card" data-set="group-stage">
          <div class="pack-preview pack-preview--gold">
            <div class="pack-foil"></div>
            <div class="pack-label">
              <span class="pack-label-top">WC 26</span>
              <span class="pack-label-main">Group Stage</span>
              <span class="pack-label-sub">8 cards · 1+ rare</span>
            </div>
          </div>
          <div class="pack-meta">
            <span class="pack-title">Group Stage Drop</span>
            <span class="pack-price">Free pull</span>
          </div>
        </button>

        <button class="pack-card" data-set="knockout">
          <div class="pack-preview pack-preview--purple">
            <div class="pack-foil"></div>
            <div class="pack-label">
              <span class="pack-label-top">WC 26</span>
              <span class="pack-label-main">Knockout</span>
              <span class="pack-label-sub">8 cards · 1+ hero</span>
            </div>
          </div>
          <div class="pack-meta">
            <span class="pack-title">Knockout Heroes</span>
            <span class="pack-price">Free pull</span>
          </div>
        </button>

        <button class="pack-card" data-set="legends">
          <div class="pack-preview pack-preview--black">
            <div class="pack-foil"></div>
            <div class="pack-label">
              <span class="pack-label-top">WC 26</span>
              <span class="pack-label-main">Legends</span>
              <span class="pack-label-sub">5 cards · 1 icon</span>
            </div>
          </div>
          <div class="pack-meta">
            <span class="pack-title">Legends of '26</span>
            <span class="pack-price">Free pull</span>
          </div>
        </button>
      </div>
    </section>

    <!-- Screen: pack ready to open -->
    <section class="screen" data-screen-id="pack">
      <button class="back-link" data-action="reset">&larr; Choose another pack</button>

      <div class="pack-stage">
        <div class="pack" id="hero-pack">
          <div class="pack-shine"></div>
          <div class="pack-foil"></div>
          <div class="pack-label">
            <span class="pack-label-top">WC 26</span>
            <span class="pack-label-main" id="hero-pack-name">Group Stage</span>
            <span class="pack-label-sub" id="hero-pack-sub">8 cards · 1+ rare</span>
          </div>
        </div>

        <!-- tear pieces rendered for the opening animation -->
        <div class="tear tear--left" aria-hidden="true"></div>
        <div class="tear tear--right" aria-hidden="true"></div>
        <div class="burst" aria-hidden="true"></div>
      </div>

      <button class="primary-btn" id="open-btn">Open Pack</button>
    </section>

    <!-- Screen: card reveal -->
    <section class="screen" data-screen-id="reveal">
      <div class="reveal-stage" id="reveal-stage">
        <!-- card stack injected by JS -->
      </div>
      <div class="reveal-hint" id="reveal-hint">Tap to reveal</div>
      <button class="primary-btn" id="open-another-btn" hidden>Open another pack</button>
    </section>

  </main>

    <footer class="footer-credit">
      Photos via <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a> · player &amp; nation data are publicly-available facts · card design © Live FIFA Open
    </footer>

  <!-- Player silhouette SVG (reused via <use>) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="silhouette" viewBox="0 0 100 120">
        <path d="M50 12c-12 0-22 10-22 22s10 22 22 22 22-10 22-22-10-22-22-22zm0 52c-22 0-40 12-40 30v26h80V94c0-18-18-30-40-30z" fill="currentColor"/>
      </symbol>
    </defs>
  </svg>

  <script src="app.js" defer></script>
</body>
</html>
